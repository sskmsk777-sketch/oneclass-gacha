<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONE CLASS GACHA</title><style>
:root{font-family:system-ui,sans-serif;color:#f7f2e7;background:#0b1020}body{margin:0}main{max-width:680px;margin:auto;padding:20px}h1{color:#e8bf62;text-align:center;letter-spacing:.12em}h2{font-size:1.1rem}section{background:#171f35;border:1px solid #3d4760;border-radius:18px;padding:18px;margin:16px 0}button,input,select{font:inherit;border-radius:10px;padding:11px;margin:4px 0}button{background:#d5aa4b;color:#16110b;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.4}input,select{background:#0c1427;color:white;border:1px solid #69748c;max-width:100%;box-sizing:border-box}label{display:block;margin:9px 0}.tabs{display:flex;gap:8px}.tabs button{flex:1}.hidden{display:none}.reels{display:flex;justify-content:center;gap:8px;font-size:58px;color:#f9d16a;margin:18px 0}.reels span{border:2px solid #d9a842;border-radius:10px;background:#60162d;padding:5px 16px}.result{text-align:center;font-size:1.5rem;color:#f8d06b;min-height:50px}.flash{animation:flash .25s infinite alternate}@keyframes flash{to{filter:brightness(2);transform:scale(1.03)}}.muted{color:#aeb9cc;font-size:.85rem}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row input{width:95px}.prize{padding:8px;border-bottom:1px solid #384158}table{width:100%;font-size:.85rem}td{padding:6px;border-bottom:1px solid #35405a;word-break:break-word}</style></head>
<body><main><h1>ONE CLASS GACHA</h1><p class="muted" style="text-align:center">店舗イベント試作版・端末内保存・本番利用不可</p><nav class="tabs"><button onclick="tab('play')">ガチャ</button><button onclick="tab('admin')">スタッフ設定</button><button onclick="tab('history')">履歴</button></nav>
<section id="play"><h2>運命の抽選</h2><p id="customerDisplay"></p><p id="remaining"></p><div id="reels" class="reels"><span>7</span><span>7</span><span>7</span></div><p class="result" id="result">STARTを押してください</p><button id="drawBtn" onclick="draw()">ガチャを引く</button><label><input type="checkbox" id="reduced"> 点滅を控える</label></section>
<section id="admin" class="hidden"><h2>スタッフによる抽選回数付与</h2><label>お客様名（試作では架空名のみ）<input id="customer" placeholder="例：テスト太郎"></label><label>担当スタッフ<input id="staff" placeholder="例：スタッフA"></label><label>付与回数<input type="number" id="count" min="1" max="100" value="1"></label><button onclick="grant()">会計確認済みとして付与</button><h2>景品と排出確率</h2><p class="muted">有効景品の確率合計を100%にしてください。抽選中の変更はできません。</p><div id="prizes"></div><p id="total"></p><div class="row"><input id="newName" placeholder="新しい景品名"><select id="newCategory"><option>ドリンク</option><option>サービス</option><option>お題</option><option>その他</option></select><button onclick="addPrize()">景品追加</button></div><button onclick="resetDemo()">デモを初期化</button></section>
<section id="history" class="hidden"><h2>抽選履歴</h2><button onclick="csv()">CSV出力</button><div id="logs"></div></section></main>
<script>
const KEY='oneclass-gacha-demo-v2';const defaults=[{id:1,name:'特賞（デモ）',category:'サービス',rate:1,active:true},{id:2,name:'1等（デモ）',category:'ドリンク',rate:9,active:true},{id:3,name:'2等（デモ）',category:'お題',rate:30,active:true},{id:4,name:'参加賞（デモ）',category:'その他',rate:60,active:true}];let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.prizes))data={prizes:defaults,remaining:0,customer:'',staff:'',logs:[]};let busy=false;const el=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(data))}function tab(id){['play','admin','history'].forEach(x=>el(x).classList.toggle('hidden',x!==id));render()}function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function valid(){const a=data.prizes.filter(p=>p.active);return a.length>0&&Math.abs(a.reduce((s,p)=>s+Number(p.rate),0)-100)<.00001&&a.every(p=>Number.isFinite(Number(p.rate))&&p.rate>=0)}function render(){el('remaining').textContent='残り '+data.remaining+' 回';el('customerDisplay').textContent=data.customer?'お客様：'+data.customer:'';el('drawBtn').disabled=busy||data.remaining<1||!valid();el('total').textContent='有効景品の合計：'+data.prizes.filter(p=>p.active).reduce((s,p)=>s+Number(p.rate),0).toFixed(2)+'%'+(valid()?'（抽選可能）':'（100%にしてください）');el('prizes').innerHTML=data.prizes.map(p=>'<div class="prize"><label><input type="checkbox" '+(p.active?'checked':'')+' onchange="editPrize('+p.id+',\'active\',this.checked)"> 有効</label><input aria-label="景品名" value="'+escapeText(p.name)+'" onchange="editPrize('+p.id+',\'name\',this.value)"><input type="number" aria-label="確率" min="0" max="100" step=".01" value="'+p.rate+'" onchange="editPrize('+p.id+',\'rate\',this.value)"> % <span class="muted">'+escapeText(p.category)+'</span> <button onclick="removePrize('+p.id+')">削除</button></div>').join('');el('logs').innerHTML='<table><tbody>'+data.logs.slice().reverse().map(x=>'<tr><td>'+escapeText(x.date)+'</td><td>'+escapeText(x.customer)+'</td><td>'+escapeText(x.staff)+'</td><td>'+escapeText(x.prize)+'</td></tr>').join('')+'</tbody></table>'}function grant(){if(busy)return;const customer=el('customer').value.trim(),staff=el('staff').value.trim(),count=Number(el('count').value);if(!customer||!staff||!Number.isInteger(count)||count<1||count>100){alert('顧客名・担当者・1〜100の回数を入力してください');return}data.customer=customer;data.staff=staff;data.remaining+=count;save();render();alert(count+'回付与しました')}function editPrize(id,key,v){if(busy)return;const p=data.prizes.find(x=>x.id===id);if(!p)return;if(key==='rate'){v=Number(v);if(!Number.isFinite(v)||v<0||v>100){alert('確率は0〜100で指定してください');render();return}}if(key==='name'&&!String(v).trim()){alert('景品名を入力してください');render();return}p[key]=v;save();render()}function addPrize(){if(busy)return;const name=el('newName').value.trim();if(!name)return alert('景品名を入力してください');data.prizes.push({id:Date.now(),name,category:el('newCategory').value,rate:0,active:true});el('newName').value='';save();render()}function removePrize(id){if(busy)return;if(!confirm('この景品を削除しますか？'))return;data.prizes=data.prizes.filter(p=>p.id!==id);save();render()}function resetDemo(){if(busy)return;if(!confirm('履歴を含むデモデータを初期化しますか？'))return;data={prizes:JSON.parse(JSON.stringify(defaults)),remaining:0,customer:'',staff:'',logs:[]};save();render()}function choose(){let n=Math.random()*100;for(const p of data.prizes.filter(p=>p.active)){n-=Number(p.rate);if(n<0)return p}return data.prizes.filter(p=>p.active).at(-1)}function draw(){if(busy||data.remaining<1||!valid())return;busy=true;const p=choose();data.remaining--;data.logs.push({date:new Date().toLocaleString('ja-JP'),customer:data.customer,staff:data.staff,prize:p.name});save();el('result').textContent='リーチ！';const reels=el('reels');if(!el('reduced').checked)reels.classList.add('flash');render();let tick=0;const interval=setInterval(()=>{tick++;reels.querySelectorAll('span').forEach(s=>s.textContent=String(Math.floor(Math.random()*10)))},85);setTimeout(()=>{clearInterval(interval);reels.classList.remove('flash');reels.querySelectorAll('span').forEach(s=>s.textContent=p.rate<=10?'7':'3');el('result').textContent='大当たり！ '+p.name;busy=false;render()},10000)}function csv(){const rows=[['日時','お客様','担当者','景品'],...data.logs.map(x=>[x.date,x.customer,x.staff,x.prize])];const text='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download='oneclass-gacha-history.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();
</script></body></html>
