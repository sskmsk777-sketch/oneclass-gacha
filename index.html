<section id="history" class="hidden"><h2>抽選履歴</h2><button onclick="csv()">CSV出力</button><div id="logs"></div></section></main>
<script>
const KEY='oneclass-gacha-demo-v2';const art={0:'assets/0.svg',1:'assets/1.png',2:'assets/2.svg',3:'assets/3.svg',4:'assets/4.svg',5:'assets/5.svg',6:'assets/6.png',7:'assets/7.png',8:'assets/8.svg',9:'assets/9.svg'};function setReels(nums){el('reels').querySelectorAll('span').forEach((node,i)=>{const n=String(nums[i]);node.textContent=n;if(art[n]){const img=document.createElement('img');img.className='number-art';img.src=art[n];img.alt=n;img.onerror=()=>{node.textContent=n};node.textContent='';node.appendChild(img)}})}const tiers={special:'特等・虹色',one:'111・専用演出',first:'一等・金色（111以外）',devil:'悪魔の数字・漆黒',miss:'ハズレ・演出なし'};const defaults=[{id:1,name:'特賞（デモ）',category:'サービス',rate:1,active:true},{id:2,name:'1等（デモ）',category:'ドリンク',rate:9,active:true},{id:3,name:'2等（デモ）',category:'お題',rate:30,active:true},{id:4,name:'参加賞（デモ）',category:'その他',rate:60,active:true}];let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.prizes))data={prizes:defaults,remaining:0,customer:'',staff:'',logs:[]};data.prizes.forEach(p=>{if(!p.tier)p.tier=({1:'special',2:'first',3:'devil',4:'miss'})[p.id]||'miss'});let busy=false;const el=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(data))}function tab(id){['play','admin','history'].forEach(x=>el(x).classList.toggle('hidden',x!==id));render()}function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function valid(){const a=data.prizes.filter(p=>p.active);return a.length>0&&Math.abs(a.reduce((s,p)=>s+Number(p.rate),0)-100)<.00001&&a.every(p=>Number.isFinite(Number(p.rate))&&p.rate>=0)}function render(){el('remaining').textContent='残り '+data.remaining+' 回';el('customerDisplay').textContent=data.customer?'お客様：'+data.customer:'';el('drawBtn').disabled=!busy&&(data.remaining<1||!valid());el('drawBtn').textContent=busy?'結果を表示（スキップ）':'ガチャを引く';el('total').textContent='有効景品の合計：'+data.prizes.filter(p=>p.active).reduce((s,p)=>s+Number(p.rate),0).toFixed(2)+'%'+(valid()?'（抽選可能）':'（100%にしてください）');el('prizes').innerHTML=data.prizes.map(p=>'<div class="prize"><label><input type="checkbox" '+(p.active?'checked':'')+' onchange="editPrize('+p.id+',\'active\',this.checked)"> 有効</label><input aria-label="景品名" value="'+escapeText(p.name)+'" onchange="editPrize('+p.id+',\'name\',this.value)"><input type="number" aria-label="確率" min="0" max="100" step=".01" value="'+p.rate+'" onchange="editPrize('+p.id+',\'rate\',this.value)"> % <select aria-label="当選ランク" onchange="editPrize('+p.id+',\'tier\',this.value)">'+Object.entries(tiers).map(([k,v])=>'<option value="'+k+'" '+(p.tier===k?'selected':'')+'>'+v+'</option>').join('')+'</select> <span class="muted">'+escapeText(p.category)+'</span> <button onclick="removePrize('+p.id+')">削除</button></div>').join('');el('logs').innerHTML='<table><tbody>'+data.logs.slice().reverse().map(x=>'<tr><td>'+escapeText(x.date)+'</td><td>'+escapeText(x.customer)+'</td><td>'+escapeText(x.staff)+'</td><td>'+escapeText(x.prize)+'</td></tr>').join('')+'</tbody></table>'}function grant(){if(busy)return;const customer=el('customer').value.trim(),staff=el('staff').value.trim(),count=Number(el('count').value);if(!customer||!staff||!Number.isInteger(count)||count<1||count>100){alert('顧客名・担当者・1〜100の回数を入力してください');return}data.customer=customer;data.staff=staff;data.remaining+=count;save();render();alert(count+'回付与しました')}function editPrize(id,key,v){if(busy)return;const p=data.prizes.find(x=>x.id===id);if(!p)return;if(key==='tier'&&!tiers[v])return;if(key==='rate'){v=Number(v);if(!Number.isFinite(v)||v<0||v>100){alert('確率は0〜100で指定してください');render();return}}if(key==='name'&&!String(v).trim()){alert('景品名を入力してください');render();return}p[key]=v;save();render()}function addPrize(){if(busy)return;const name=el('newName').value.trim();if(!name)return alert('景品名を入力してください');data.prizes.push({id:Date.now(),name,category:el('newCategory').value,rate:0,active:true,tier:'miss'});el('newName').value='';save();render()}function removePrize(id){if(busy)return;if(!confirm('この景品を削除しますか？'))return;data.prizes=data.prizes.filter(p=>p.id!==id);save();render()}function resetDemo(){if(busy)return;if(!confirm('履歴を含むデモデータを初期化しますか？'))return;data={prizes:JSON.parse(JSON.stringify(defaults)),remaining:0,customer:'',staff:'',logs:[]};save();render()}function choose(){let n=Math.random()*100;for(const p of data.prizes.filter(p=>p.active)){n-=Number(p.rate);if(n<0)return p}return data.prizes.filter(p=>p.active).at(-1)}let pendingPrize=null,drawInterval=null,drawTimer=null;function reelNumbers(prize){if(prize.tier==='special')return [7,7,7];if(prize.tier==='one')return [1,1,1];if(prize.tier==='first'){const numbers=[2,3,4,5,8,9];const n=numbers[Math.floor(Math.random()*numbers.length)];return [n,n,n]}if(prize.tier==='devil')return [6,6,6];let a,b,c;do{a=Math.floor(Math.random()*10);b=Math.floor(Math.random()*10);c=Math.floor(Math.random()*10)}while(a===b&&b===c);return [a,b,c]}let jackpotTimeout=null,fxFrame=null,fxEnd=0;let devilVideoTimer=null;function stopDevilVideo(){const v=el('devilVideo');clearTimeout(devilVideoTimer);v.pause();v.removeAttribute('src');v.load();el('devilVideoOverlay').classList.remove('active');el('devilVideoOverlay').setAttribute('aria-hidden','true')}function enableDevilSound(){const v=el('devilVideo');v.muted=false;v.volume=1;el('devilUnmute').classList.add('hidden');v.play().catch(()=>{})}function playSpecialVideo(number){const v=el('devilVideo');stopDevilVideo();el('devilVideoOverlay').classList.add('active');el('devilVideoOverlay').setAttribute('aria-hidden','false');el('devilUnmute').classList.remove('hidden');v.src='assets/'+number+'.mp4';v.muted=true;v.currentTime=0;v.onended=stopDevilVideo;v.onerror=stopDevilVideo;v.play().catch(stopDevilVideo);devilVideoTimer=setTimeout(stopDevilVideo,14000)}function playDevilVideo(){const v=el('devilVideo');stopDevilVideo();el('devilVideoOverlay').classList.add('active');el('devilVideoOverlay').setAttribute('aria-hidden','false');el('devilUnmute').classList.remove('hidden');v.src='assets/666.mp4';v.muted=true;v.currentTime=0;v.onended=stopDevilVideo;v.onerror=stopDevilVideo;v.play().catch(stopDevilVideo);devilVideoTimer=setTimeout(stopDevilVideo,14000)}function clearParticles(){if(fxFrame)cancelAnimationFrame(fxFrame);fxFrame=null;const canvas=el('fxCanvas');if(canvas){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height)}}function particleBurst(tier){clearParticles();if(el('reduced').checked||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const canvas=el('fxCanvas'),rect=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);const w=rect.width,h=rect.height;const palette=tier==='special'?['#fff','#ffde38','#ff39bc','#32faff','#5dff77','#b78cff']:tier==='first'?['#fff','#fff4b4','#ffc428','#ed8e00']:['#b993f7','#6d1e91','#c33352','#16101e'];const particles=Array.from({length:tier==='special'?125:85},()=>{const angle=Math.random()*Math.PI*2,speed=1.4+Math.random()*6;return{x:w/2,y:h*.45,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-1.5,life:45+Math.random()*45,r:1+Math.random()*4,c:palette[Math.floor(Math.random()*palette.length)],shape:Math.random()>.6}});const start=performance.now();function frame(now){ctx.clearRect(0,0,w,h);const dt=Math.min((now-start)/16.67,150);for(const p of particles){const t=Math.min(dt,p.life),alpha=Math.max(0,1-t/p.life);if(!alpha)continue;const x=p.x+p.vx*t,y=p.y+p.vy*t+.055*t*t;ctx.globalAlpha=alpha;ctx.fillStyle=p.c;ctx.shadowBlur=14;ctx.shadowColor=p.c;if(p.shape){ctx.save();ctx.translate(x,y);ctx.rotate(t*.1);ctx.fillRect(-p.r,-p.r,p.r*2,p.r*2);ctx.restore()}else{ctx.beginPath();ctx.arc(x,y,p.r,0,Math.PI*2);ctx.fill()}}ctx.globalAlpha=1;ctx.shadowBlur=0;if(dt<95)fxFrame=requestAnimationFrame(frame);else clearParticles()}fxFrame=requestAnimationFrame(frame)}function clearJackpot(){clearTimeout(jackpotTimeout);clearParticles();document.body.classList.remove('jackpot','quiet-jackpot')}function finishDraw(){if(!busy||!pendingPrize)return;clearInterval(drawInterval);clearTimeout(drawTimer);el('reels').classList.remove('flash');document.body.classList.remove('drawing');const nums=reelNumbers(pendingPrize);setReels(nums);document.body.classList.remove('tier-special','tier-one','tier-first','tier-devil');if(pendingPrize.tier!=='miss'&&!el('reduced').checked)document.body.classList.add('tier-'+pendingPrize.tier);el('result').textContent=(pendingPrize.tier==='miss'?'ハズレ':'【'+tiers[pendingPrize.tier]+'】')+' '+pendingPrize.name;if(pendingPrize.tier!=='miss'){el('jackpotBanner').textContent=pendingPrize.tier==='special'?'超・特等!!':pendingPrize.tier==='one'?'111 SPECIAL':pendingPrize.tier==='first'?'大当たり!!':'666 DEVIL';el('jackpotSub').textContent=pendingPrize.name;document.body.classList.add('jackpot');if(el('reduced').checked)document.body.classList.add('quiet-jackpot');particleBurst(pendingPrize.tier);if(pendingPrize.tier==='devil'&&!el('reduced').checked)playDevilVideo();if(pendingPrize.tier==='one'&&!el('reduced').checked)playSpecialVideo('111');if(pendingPrize.tier==='special'&&!el('reduced').checked)playSpecialVideo('777');jackpotTimeout=setTimeout(clearJackpot,3200)}pendingPrize=null;busy=false;render()}function draw(){if(busy){finishDraw();return}if(data.remaining<1||!valid())return;clearJackpot();document.body.classList.remove('tier-special','tier-first','tier-devil');busy=true;document.body.classList.add('drawing');pendingPrize=choose();data.remaining--;data.logs.push({date:new Date().toLocaleString('ja-JP'),customer:data.customer,staff:data.staff,prize:pendingPrize.name});save();el('result').textContent='抽選中… タップでスキップ';const reels=el('reels');if(!el('reduced').checked)reels.classList.add('flash');render();drawInterval=setInterval(()=>{setReels(Array.from({length:3},()=>Math.floor(Math.random()*10)))},100);drawTimer=setTimeout(finishDraw,1800)}el('reels').addEventListener('click',()=>{if(busy)finishDraw()});el('result').addEventListener('click',()=>{if(busy)finishDraw()});function csv(){const rows=[['日時','お客様','担当者','景品'],...data.logs.map(x=>[x.date,x.customer,x.staff,x.prize])];const text='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download='oneclass-gacha-history.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();
</script></body></html>
